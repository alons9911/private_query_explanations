# Candidate spaces for the case-study pair search (scripts/search_pairs.py).
# Every base query is a conjunction of at most two atoms from `atoms`.

refinement:
  adult:
    agg: income            # AVG(income) = high-income rate, the aggregate of the motivating example
    min_size: 1500
    max_size: 20000
    proxies: {gender: [relationship], maritalStatus: [relationship], race: []}
    atoms:
      - "occupation = 'Craft-repair'"
      - "occupation = 'Exec-managerial'"
      - "occupation = 'Prof-specialty'"
      - "occupation = 'Sales'"
      - "occupation = 'Transport-moving'"
      - "occupation = 'Machine-op-inspct'"
      - "occupation = 'Tech-support'"
      - "occupation = 'Protective-serv'"
      - "education IN ('Bachelors', 'Masters')"
      - "education IN ('Masters', 'Doctorate', 'Prof-school')"
      - "education = 'HS-grad'"
      - "education = 'Some-college'"
      - "workclass IN ('Self-emp-inc', 'Self-emp-not-inc')"
      - "workclass = 'Federal-gov'"
      - "workclass = 'Local-gov'"
      - "maritalStatus = 'Married-civ-spouse'"
      - "maritalStatus = 'Never-married'"
      - "hoursPerWeek >= 45"
      - "hoursPerWeek >= 50"
      - "age >= 40"
      - "age >= 50"
      - "income = 1"
    constraints:
      - {attr: gender, value: Female, min_share: 0.30}
      - {attr: race, values: [Black, Asian-Pac-Islander, Amer-Indian-Eskimo, Other], min_share: 0.15}
      - {where: "age < 30", min_share: 0.25}
  tax:
    agg: Rate
    min_size: 3000
    max_size: 80000
    proxies: {MaritalStatus: [SingleExemp, MarriedExemp], HasChild: [ChildExemp], Rate: [], Salary: []}
    atoms:
      - "State IN ('CA', 'NY', 'NJ', 'MA', 'CT')"
      - "State IN ('TX', 'FL', 'WA', 'NV', 'TN')"
      - "Salary >= 70000"
      - "Salary <= 30000"
      - "Rate >= 6"
      - "Rate <= 2"
      - "MaritalStatus = 'M'"
      - "MaritalStatus = 'S'"
      - "HasChild = 'Y'"
      - "HasChild = 'N'"
      - "SingleExemp > 0"
      - "ChildExemp > 0"
    constraints:
      - {attr: HasChild, value: "Y", min_share: 0.30}
      - {attr: MaritalStatus, value: "S", min_share: 0.30}
      - {where: "Rate > 0", min_share: 0.50}
      - {where: "Salary <= 40000", min_share: 0.30}

  # --- refinement-only experiments (2026-11-27): COMPAS (Erica's attributes and groups), Law Students
  # (the dataset of Campbell et al. 2024), MEPS (the healthcare dataset of the fairness literature).
  # Thresholds of the constraints are near each group's share in the data.
  compas:
    agg: decile_score        # AVG(decile_score): the mean risk score of the selected defendants
    min_size: 1500
    max_size: 8000
    proxies: {race: [], age_cat: [age], sex: []}
    atoms:
      - "decile_score >= 5"
      - "decile_score >= 7"
      - "decile_score >= 8"
      - "priors_count >= 2"
      - "priors_count >= 4"
      - "priors_count >= 7"
      - "juv_fel_count >= 1"
      - "c_charge_degree = 'felony'"
      - "c_charge_degree = 'misdemeanor'"
      - "is_recid = 'yes'"
      - "is_violent_recid = 'yes'"
    constraints:
      - {attr: race, value: Caucasian, min_share: 0.35}
      - {attr: age_cat, value: 'Greater than 45', min_share: 0.20}
      - {attr: sex, value: Female, min_share: 0.20}
  law:
    agg: first_pf            # AVG(first_pf): the first-attempt bar passage rate
    min_size: 1500
    max_size: 15000
    proxies: {race: [], sex: []}
    atoms:
      - "LSAT >= 35"
      - "LSAT >= 40"
      - "UGPA >= 3.0"
      - "UGPA >= 3.5"
      - "ZFYA >= 0"
      - "ZFYA >= 0.5"
      - "sander_index >= 0.8"
      - "region_first IN ('NE', 'GL')"
      - "region_first IN ('FW', 'SE', 'SC')"
      - "first_pf = 1"
    constraints:
      - {attr: race, values: [Black, Hispanic, Mexican, Puertorican, Amerindian], min_share: 0.10}
      - {attr: sex, value: F, min_share: 0.45}
  meps:
    agg: TOTEXP              # AVG(TOTEXP): the mean health-care expenditure of the selected people
    min_size: 1500
    max_size: 12000
    proxies: {RACE: [], SEX: [], AGE: []}
    atoms:
      - "UTILIZATION >= 10"
      - "UTILIZATION >= 20"
      - "TOTEXP >= 5000"
      - "TOTEXP >= 20000"
      - "RTHLTH IN ('fair', 'poor')"
      - "DIABDX = 'yes'"
      - "HIBPDX = 'yes'"
      - "ACTLIM = 'yes'"
      - "INSCOV = 'public only'"
      - "INSCOV = 'private'"
      - "POVCAT IN ('poor', 'near poor')"
    constraints:
      - {attr: RACE, values: [Black, Hispanic], min_share: 0.45}
      - {attr: SEX, value: M, min_share: 0.45}
      - {where: "AGE < 45", min_share: 0.30}

cqa:
  tax_dirty:
    agg: Rate
    min_size: 2000
    atoms:
      - "State IN ('NJ', 'NY', 'PA', 'CT', 'MA')"
      - "State IN ('AL', 'AR', 'GA', 'MS', 'TN')"
      - "State IN ('AK', 'HI', 'WA', 'OR', 'CA')"
      - "State IN ('AL', 'AR', 'NJ', 'DE', 'RI')"
      - "MaritalStatus = 'M'"
      - "MaritalStatus = 'S'"
      - "HasChild = 'Y'"
      - "Gender = 'F'"
      - "Salary >= 70000"
      - "Salary <= 30000"
      - "Rate >= 5"
      - "Rate <= 3"
      - "SingleExemp > 0"
      - "MarriedExemp > 0"
      - "ChildExemp > 0"
  hospital:
    agg: Score
    min_size: 60
    atoms:
      - "HospitalType = 'acute care hospitals'"
      - "EmergencyService = 'yes'"
      - "EmergencyService = 'no'"
      - "HospitalOwner = 'proprietary'"
      - "HospitalOwner = 'voluntary non-profit - private'"
      - "HospitalOwner = 'government - hospital district or authority'"
      - "HospitalOwner = 'voluntary non-profit - other'"
      - "Condition = 'heart attack'"
      - "Condition = 'pneumonia'"
      - "Condition = 'surgical infection prevention'"
      - "Condition = 'heart failure'"
