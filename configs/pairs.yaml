# --- Erica ACSIncome pairs: generated by `pqde run erica` ---
# Erica's ACSIncome benchmark (Li et al., PVLDB 17(2), 2023): queries and constraints of its
# Figures 2-3; Q' = one of the minimal refinements Erica returned (stored by the authors),
# chosen by `pqde run erica` (results/erica_selection/candidates.csv).

ACS_Q1C1:
  dataset: acsincome
  kind: refinement
  aggregate: PINCP
  source: "Erica (Li et al., PVLDB 2023), Q1^A with C1^A; Q' chosen by story score"
  q1: "WKHP >= 40 AND SCHL >= 19 AND COW IN ('3', '4', '5')"
  q2: "WKHP >= 40 AND SCHL >= 19 AND COW IN ('3', '4', '5', '1')"
  constraints:
    - {where: "SEX = 'F' AND MAR = 1", min_count: 48884}
    - {where: "RAC1P = 2", min_count: 15719}

ACS_Q1C2:
  dataset: acsincome
  kind: refinement
  aggregate: PINCP
  source: "Erica (Li et al., PVLDB 2023), Q1^A with C2^A; Q' chosen by story score"
  q1: "WKHP >= 40 AND SCHL >= 19 AND COW IN ('3', '4', '5')"
  q2: "WKHP >= 41 AND SCHL >= 19 AND COW IN ('3', '4', '5')"
  constraints:
    - {where: "SEX = 'M' AND RELP = 1", max_count: 15249}
    - {where: "age_bucket = '30-60' AND MAR = 3", max_count: 11498}

ACS_Q2C1:
