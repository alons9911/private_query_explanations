# Default parameters of Section 5.1 and the grids of every experiment.
# `pqde run <exp> --quick` shrinks trials/repeats for a smoke run.

defaults:
  k: 5
  lam: 0.5
  epsilon: 1.0
  split: [0.333333333, 0.333333333, 0.333333334]   # eps_P, eps_S, eps_H
  tau_factor: 3                                   # tau = min(3k, |P|), Eq. (11)
  release: pair                                   # noisy (H1, H2); "diff" releases H1 - H2
  gamma_eval: 0.0                                 # metric uses the unsmoothed HD
  trials: 40
  seed: 20261031

# E1 -- case studies (Section 5.2): one released run per pair + view-stage report
e1:
  pairs: [A1, A2, A3, T1, T2, T3, S1, S2, S3, H1, H2, H3]
  run_seed: 7

# E2 -- quality vs. privacy budget against B1-B3 (Section 5.3.1, Table 3, Figure 6)
e2:
  pairs: [A1, A2, A3, T1, T2, T3, S1, S2, S3, H1, H2, H3]
  figure_pairs: [A1, A2, T1]
  epsilons: [0.1, 0.2, 0.5, 1.0, 2.0, 5.0]
  table_epsilons: [1.0, 5.0]

# E3 -- what drives accuracy: margins, smoothing gamma, the view stage, budget split
e3:
  pairs: [A1, A2, T1]
  gamma_multipliers: [0.03, 0.1, 0.3, 1.0, 3.0, 10.0]   # x the Eq. (12) value
  gamma_percent_of_N: [0.0, 0.1, 0.5, 1.0, 2.0, 5.0]
  view_stage_eps_P: [0.01, 0.0333, 0.1, 0.3333, 1.0, 3.0, 10.0]
  splits:
    - [0.3333, 0.3333, 0.3334]
    - [0.10, 0.55, 0.35]
    - [0.20, 0.40, 0.40]
    - [0.50, 0.25, 0.25]
    - [0.05, 0.60, 0.35]
  bin_stat_gamma_percent: [0.5, 5.0]

# E4 -- running time (Section 5.3.2, Figure 7)
e4:
  pair: A2
  repeats: 20
  ks: [1, 2, 3, 5, 10, 20, 40]
  n_fractions: [0.1, 0.25, 0.5, 0.75, 1.0]
  epsilons: [0.1, 0.2, 0.5, 1.0, 2.0, 5.0]
  view_pool_sizes: [100, 250, 500, 750, 1048]
  tau_percent_of_P: [1, 2, 5, 10, 20, 40]
  gamma_percent_of_N: [0.0, 0.1, 0.5, 1.0, 2.0, 5.0]
  # larger-N sweep on the tax pair T1 (rows re-sampled from the benchmark file)
  tax_pair: T1
  tax_rows: [50000, 100000, 200000, 350000, 500000]

# E5 -- cost of privacy in running time (Section 5.3.2, Figure 8)
e5:
  pairs: [A1, A2, A3, T1, T2, T3, S1, S2, S3, H1, H2, H3]
  repeats: 20
  b2_pair: A2
  b2_pool_sizes: [20, 25, 30, 35, 40, 45, 50]
